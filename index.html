<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Werkstatt Urlaubsplanung</title>
  <style>
    :root {
      --bg: #f4f5f7; --card: #fff; --text: #1f2937; --muted: #6b7280; --line: #e5e7eb;
      --ok: #15803d; --ok-bg: #dcfce7; --bad: #b91c1c; --bad-bg: #fee2e2; --off: #eceef1;
      --accent: #1d4ed8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
    header { background: #111827; color: #fff; padding: 14px 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
    header h1 { margin: 0; font-size: 18px; }
    header .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; }
    header label { display: flex; gap: 4px; align-items: center; }
    main { padding: 16px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); max-width: 1600px; margin: 0 auto; }
    .card { background: var(--card); border-radius: 10px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); min-width: 0; }
    .card.wide { grid-column: 1 / -1; }
    h2 { margin: 0 0 12px; font-size: 16px; }
    form { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
    form label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 2px; flex: 1 1 130px; }
    input, select, button { font: inherit; padding: 7px 9px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; color: var(--text); }
    button { background: var(--accent); border-color: var(--accent); color: #fff; cursor: pointer; }
    button.ghost { background: transparent; color: inherit; border-color: currentColor; }
    button.del { background: transparent; color: var(--bad); border: none; padding: 2px 6px; }
    table { border-collapse: collapse; width: 100%; }
    td, th { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; }
    .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; color: #fff; font-size: 12px; white-space: nowrap; }
    .stats { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
    .stat { border-left: 4px solid; padding: 4px 10px; background: #f9fafb; border-radius: 4px; }
    .msg { margin-top: 12px; padding: 10px 12px; border-radius: 6px; }
    .msg.ok { background: var(--ok-bg); color: var(--ok); }
    .msg.bad { background: var(--bad-bg); color: var(--bad); }
    .msg.warn { background: #fef3c7; color: #92400e; }
    .msg ul { margin: 6px 0 0; padding-left: 18px; }
    .rules { font-size: 12px; color: var(--muted); margin: 8px 0 0; padding-left: 18px; }
    .scroll { max-height: 280px; overflow: auto; }

    /* Kalender */
    .cal-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .cal-head h2 { margin: 0; min-width: 170px; }
    .legend { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
    .cal-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
    .cal { border-collapse: separate; border-spacing: 0; font-size: 12px; width: max-content; min-width: 100%; }
    .cal th, .cal td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 0; text-align: center; height: 26px; min-width: 28px; }
    .cal th.name, .cal td.name { position: sticky; left: 0; background: #fff; z-index: 1; text-align: left; padding: 0 10px; min-width: 190px; white-space: nowrap; }
    .cal td.name { border-left: 5px solid; }
    .cal thead th { background: #f9fafb; font-weight: 600; }
    .cal thead th small { display: block; font-weight: 400; color: var(--muted); }
    .cal .off { background: var(--off); }
    .cal .today { box-shadow: inset 0 0 0 2px var(--accent); }
    .cal td.vac { color: #fff; font-weight: 600; }
    .cal td.dep { font-weight: 700; font-size: 11px; background: repeating-linear-gradient(45deg, #fff, #fff 4px, #f3f4f6 4px, #f3f4f6 8px); box-shadow: inset 0 0 0 2px currentColor; }
    .deps { white-space: nowrap; }
    .qual { display: inline-block; padding: 0 5px; border-radius: 4px; color: #fff; font-size: 10px; font-weight: 700; vertical-align: 1px; margin-left: 2px; }
    .qualmin { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-top: 10px; font-size: 12px; color: var(--muted); }
    .qualmin label { display: flex; align-items: center; gap: 4px; color: var(--text); }
    .qualmin input { width: 58px; padding: 3px 6px; }
    .deps label { display: inline-flex; align-items: center; gap: 1px; margin-right: 6px; font-size: 11px; font-weight: 600; cursor: pointer; }
    .deps input { margin: 0; padding: 0; }
    .cal tr.group td { background: #f3f4f6; font-weight: 600; text-align: left; padding: 0 10px; }
    .cal tr.group td.name { background: #f3f4f6; }
    .cal tr.sum td { font-weight: 600; }
    .cal td.okc { background: var(--ok-bg); color: var(--ok); }
    .cal td.badc { background: var(--bad-bg); color: var(--bad); }
    .empty { color: var(--muted); padding: 12px; }
  </style>
</head>
<body>
<header>
  <h1>🔧 Werkstatt Urlaubsplanung</h1>
  <div class="tools">
    <label><input type="checkbox" id="setSaturday"> Samstag ist Arbeitstag</label>
    <label><input type="checkbox" id="setHolidays" checked> Feiertage (AT) frei</label>
    <button class="ghost" id="btnExport" title="Daten als JSON-Datei sichern">Export</button>
    <button class="ghost" id="btnImport" title="Daten aus JSON-Datei laden">Import</button>
    <input type="file" id="fileImport" accept="application/json" hidden>
  </div>
</header>

<main>
  <!-- 1) Personen -->
  <section class="card">
    <h2>1. Personen erfassen</h2>
    <form id="formPerson">
      <label>Name <input id="pName" required placeholder="z. B. Max Huber"></label>
      <label>Stelle <select id="pRole"></select></label>
      <button type="submit">Hinzufügen</button>
    </form>
    <div class="qualmin" id="qualMin"></div>
    <div class="stats" id="stats"></div>
    <div id="baseCheck"></div>
    <div class="scroll"><table id="tblPersons"></table></div>
  </section>

  <!-- 2) Urlaubsantrag -->
  <section class="card">
    <h2>2. Urlaubsantrag</h2>
    <form id="formVacation">
      <label>Person <select id="vPerson" required></select></label>
      <label>Von <input type="date" id="vFrom" required></label>
      <label>Bis <input type="date" id="vTo" required></label>
      <button type="submit">Prüfen &amp; eintragen</button>
    </form>
    <ul class="rules" id="rulesList"></ul>
    <div id="result"></div>
    <h2 style="margin-top:16px">Eingetragene Urlaube</h2>
    <div class="scroll"><table id="tblVacations"></table></div>
  </section>

  <!-- 3) Kalender -->
  <section class="card wide">
    <div class="cal-head">
      <button class="ghost" id="prevMonth" aria-label="Vormonat">◀</button>
      <h2 id="monthTitle"></h2>
      <button class="ghost" id="nextMonth" aria-label="Folgemonat">▶</button>
      <button class="ghost" id="thisMonth">Heute</button>
      <div class="legend" id="legend"></div>
    </div>
    <div class="cal-wrap"><table class="cal" id="calendar"></table></div>
  </section>
</main>

<script src="rules.js"></script>
<script src="app.js"></script>
</body>
</html>
